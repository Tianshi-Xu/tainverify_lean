name: Verify

on:
  push:
    paths-ignore:
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:
    inputs:
      full:
        description: "Build the complete Lean corpus (slow on GitHub-hosted runners)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - name: Python regressions
        run: PYTHONPATH=. python -m pytest -q Verdict/tests scripts/tests trainverify/tests
      - name: Generated certificate and coverage checks
        run: |
          python trainverify/scripts/generate_multiref_certificates.py --check
          python trainverify/scripts/count_yoco_faithful_coverage.py

  lean-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: trainverify
          build-args: >-
            denote.GraphGears
            denote.MultirefCertificate
            denote.yoco_goals.MultirefCertificateRegression

  lean-full:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: trainverify
          build-args: denote

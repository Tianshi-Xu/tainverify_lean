name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - name: Python regressions
        run: PYTHONPATH=. python -m pytest -q Verdict/tests scripts/tests trainverify/tests
      - name: Generated certificate and coverage checks
        run: |
          python trainverify/scripts/generate_multiref_certificates.py --check
          python trainverify/scripts/count_yoco_faithful_coverage.py

  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: trainverify
          build-args: denote
          use-mathlib-cache: "true"

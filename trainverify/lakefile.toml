name = "trainverify"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Trainverify"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3
linter.style.longLine = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.27.0-rc1"

[[lean_lib]]
name = "Trainverify"

[[lean_lib]]
name = "denote"
roots = ["denote"]
# Large gpt2 graphs require deep kernel recursion (~4365) when peeling producing
# nodes from the real graph; bump the elaboration thread stack to 1 GB.
moreLeanArgs = ["-s", "1048576"]
